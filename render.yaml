# yaml-language-server: $schema=https://render.com/schema/render.yaml

services:
  - type: web
    name: shopflare-api
    plan: free
    runtime: python
    rootDir: Backend
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "python manage.py migrate --noinput ; gunicorn auth.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --log-file -"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: web
    name: shopflare-web
    runtime: static
    rootDir: Frontend
    buildCommand: "npm install && npm run build:web"
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
