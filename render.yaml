databases:
  - name: shopflare-db
    plan: free
    databaseName: shopflare
    user: shopflare

services:
  - type: web
    name: shopflare-api
    plan: free
    runtime: python
    rootDir: Backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn auth.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopflare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
