# yaml-language-server: $schema=https://render.com/schema/render.yaml
databases:
  - name: shopflare-db
    plan: free
    databaseName: shopflare
    user: shopflare

services:
  - type: web
    name: shopflare-api
    plan: free
    runtime: python
    rootDir: Backend
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py migrate --noinput"
    startCommand: "gunicorn auth.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopflare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: web
    name: shopflare-web
    runtime: static
    rootDir: Frontend
    buildCommand: "npm install && npm run build:web"
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
